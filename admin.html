<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administration – Ma Boutique</title>
<style>
:root{--bg:#f5f7f4;--c:#fff;--t:#1c2a23;--m:#66766d;--p:#1f7a4d;--r:#c0392b;--b:#dde4df}
@media(prefers-color-scheme:dark){:root{--bg:#111613;--c:#1a221d;--t:#edf3ee;--m:#98a89e;--p:#3fb27a;--r:#ff7b6b;--b:#2a352e}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
#login,#app{display:none;max-width:560px;margin:auto;padding:14px}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
button{font:inherit;padding:10px 14px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)}
button.main{background:var(--p);color:#fff;border:0;width:100%;margin-top:6px}
button.x{color:var(--r)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
.bt{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
small,.m{color:var(--m)}.neg{color:var(--r)}
#bar{display:flex;justify-content:space-between;align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
</style></head>
<body>
<div id="login"><h2>Administration</h2>
<form id="lf"><input id="em" type="email" placeholder="E-mail administrateur" autocomplete="username" required>
<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
<button class="main">Se connecter</button><p id="err" class="neg"></p></form></div>
<div id="app">
<div id="bar"><h2>Administration</h2><button data-a="out">Sortir</button></div>
<div class="card"><b>Nouvelle boutique</b>
<input id="sc" placeholder="Code de la boutique (ex : chez-fanta)" autocapitalize="none">
<input id="sn" placeholder="Nom de la boutique">
<input id="sd" type="number" inputmode="numeric" placeholder="Jours d’abonnement (30 par défaut)">
<button class="main" data-a="mkshop">Créer la boutique</button></div>
<div class="card"><b>Nouveau compte</b>
<select id="sel"></select>
<input id="ue" type="email" placeholder="E-mail du compte">
<input id="up" type="text" placeholder="Mot de passe (8 caractères minimum)" autocomplete="off">
<select id="ur"><option value="vendeur">vendeur</option><option value="comptable">comptable</option><option value="patron">patron (forfait Complet)</option></select>
<button class="main" data-a="mkuser">Créer le compte</button><p id="res" class="m"></p></div>
<h3>Boutiques</h3><div id="list"></div></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,updateDoc,onSnapshot,Timestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDFS_aJPHmarHVL8UiHwn39njO34Kk7k1w",authDomain:"ma-boutique-e1fe3.firebaseapp.com",projectId:"ma-boutique-e1fe3",storageBucket:"ma-boutique-e1fe3.firebasestorage.app",messagingSenderId:"66591651573",appId:"1:66591651573:web:572780596e446d3c6c37bc"},
ADMIN="PQ15rICcjFSALPRUsWQxaVxuXFH3";
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),secAuth=getAuth(initializeApp(cfg,"sec"));
const $=s=>document.querySelector(s),v=id=>$("#"+id).value.trim(),
esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),
fd=ms=>new Date(ms).toLocaleDateString("fr-FR");
let shops=[],unsub=null;
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
function show(x){$("#login").style.display=x=="login"?"block":"none";$("#app").style.display=x=="app"?"block":"none"}
$("#lf").onsubmit=async e=>{e.preventDefault();$("#err").textContent="";
 try{await signInWithEmailAndPassword(auth,v("em"),$("#pw").value)}catch(x){$("#err").textContent="E-mail ou mot de passe incorrect"}};
onAuthStateChanged(auth,u=>{
 if(unsub){unsub();unsub=null}
 if(u&&u.uid===ADMIN){show("app");unsub=onSnapshot(collection(db,"shops"),s=>{shops=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>toast("Lecture refusée"))}
 else{if(u){$("#err").textContent="Accès réservé à l’administrateur";signOut(auth)}show("login")}});
function draw(){const s=$("#sel"),cur=s.value;
 s.innerHTML=shops.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} (${esc(x.id)})</option>`).join("");if(cur)s.value=cur;
 $("#list").innerHTML=shops.map(x=>{const ms=x.accessUntil?.toMillis()||0,st=x.blocked?"Bloquée":ms>Date.now()?"Active":"Expirée",cp=x.plan=="complet",
 pl=cp?"Complet : vendeur + comptable + patron · 100 000 GNF/mois":"Base : vendeur + comptable · 60 000 GNF/mois";
 return `<div class="card"><b>${esc(x.name)}</b> <small>code : ${esc(x.id)}</small><br>${st} · fin le ${fd(ms)}<br><small>${pl}</small><div class="bt"><button data-a="ext" data-id="${esc(x.id)}" data-n="30">+30 jours</button><button data-a="ext" data-id="${esc(x.id)}" data-n="90">+90 jours</button><button data-a="plan" data-id="${esc(x.id)}">${cp?"→ Base":"→ Complet"}</button><button class="${x.blocked?"":"x"}" data-a="blk" data-id="${esc(x.id)}">${x.blocked?"Débloquer":"Bloquer"}</button></div></div>`}).join("")||'<p class="m">Aucune boutique.</p>'}
const A={
out:()=>signOut(auth),
mkshop:()=>{const c=v("sc").toLowerCase(),n=v("sn"),d=+v("sd")||30;
 if(!/^[a-z0-9-]{3,30}$/.test(c))return toast("Code : 3 à 30 lettres, chiffres ou tirets");
 if(!n)return toast("Le nom est obligatoire");
 if(shops.some(x=>x.id==c))return toast("Ce code existe déjà");
 setDoc(doc(db,"shops",c),{name:n,plan:"base",blocked:false,accessUntil:Timestamp.fromMillis(Date.now()+d*864e5)}).then(()=>{toast("Boutique créée");["sc","sn","sd"].forEach(i=>$("#"+i).value="")}).catch(e=>toast("Refusé : "+e.code))},
ext:b=>{const x=shops.find(s=>s.id==b.dataset.id),base=Math.max(Date.now(),x.accessUntil?.toMillis()||0);
 updateDoc(doc(db,"shops",x.id),{accessUntil:Timestamp.fromMillis(base+b.dataset.n*864e5)}).then(()=>toast("Abonnement prolongé")).catch(e=>toast("Refusé : "+e.code))},
plan:b=>{const x=shops.find(s=>s.id==b.dataset.id);
 updateDoc(doc(db,"shops",x.id),{plan:x.plan=="complet"?"base":"complet"}).catch(e=>toast("Refusé : "+e.code))},
blk:b=>{const x=shops.find(s=>s.id==b.dataset.id);if(!confirm((x.blocked?"Débloquer ":"Bloquer ")+x.name+" ?"))return;
 updateDoc(doc(db,"shops",x.id),{blocked:!x.blocked}).catch(e=>toast("Refusé : "+e.code))},
mkuser:async()=>{const code=$("#sel").value,em=v("ue"),pw=$("#up").value,role=$("#ur").value;
 if(!shops.some(s=>s.id==code))return toast("Créez d’abord une boutique");
 if(!em||pw.length<8)return toast("E-mail et mot de passe (8 caractères minimum)");
 try{const c=await createUserWithEmailAndPassword(secAuth,em,pw);
  await setDoc(doc(db,"shops",code,"members",c.user.uid),{role,email:em});await signOut(secAuth);
  if(role=="patron")await updateDoc(doc(db,"shops",code),{plan:"complet"});
  $("#res").textContent="Compte créé. À donner au client : code "+code+", e-mail "+em+", mot de passe "+pw+".";$("#ue").value="";$("#up").value=""
 }catch(e){toast(e.code=="auth/email-already-in-use"?"Cette adresse existe déjà":"Refusé : "+(e.code||e.message))}}};
document.addEventListener("click",e=>{const b=e.target.closest("button[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b)});
show("login");
</script></body></html>
