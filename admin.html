
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administration – Ma Boutique</title>
<style>
:root{--bg:#f5f7f4;--c:#fff;--t:#1c2a23;--m:#66766d;--p:#1f7a4d;--r:#c0392b;--b:#dde4df}
@media(prefers-color-scheme:dark){:root{--bg:#111613;--c:#1a221d;--t:#edf3ee;--m:#98a89e;--p:#3fb27a;--r:#ff7b6b;--b:#2a352e}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
#login,#app{display:none;max-width:600px;margin:auto;padding:14px}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
button{font:inherit;padding:10px 14px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)}
button.main{background:var(--p);color:#fff;border:0;width:100%;margin-top:6px}
button.x{color:var(--r)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
.bt{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
small,.m{color:var(--m)}
.neg{color:var(--r)}
#bar{display:flex;justify-content:space-between;align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90%;text-align:center}
.price{font-size:20px;font-weight:700;color:var(--p)}
</style>
</head>
<body>

<div id="login">
<h2>Administration</h2>
<form id="lf">
<input id="em" type="email" placeholder="E-mail administrateur" autocomplete="username" required>
<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
<button class="main">Se connecter</button>
<p id="err" class="neg"></p>
</form>
</div>

<div id="app">
<div id="bar">
<h2>Administration</h2>
<button data-a="out">Sortir</button>
</div>

<div class="card">
<b>Nouvelle boutique</b>
<input id="sc" placeholder="Code (ex : chez-fanta)" autocapitalize="none">
<input id="sn" placeholder="Nom de la boutique">
<select id="st">
<option value="boutique">Boutique</option>
<option value="boulangerie">Boulangerie</option>
<option value="pharmacie">Pharmacie</option>
<option value="quincaillerie">Quincaillerie</option>
<option value="restaurant">Restaurant</option>
</select>
<input id="sd" type="number" inputmode="numeric" placeholder="Jours d'abonnement (30 par défaut)">
<button class="main" data-a="mkshop">Créer la boutique</button>
</div>

<div class="card">
<b>Nouveau compte</b>
<select id="sel"></select>
<input id="ue" type="email" placeholder="E-mail du compte">
<input id="up" type="password" placeholder="Mot de passe (8 caractères minimum)" autocomplete="new-password">
<select id="ur">
<option value="vendeur">Vendeur – 30 000 FG/mois</option>
<option value="comptable">Comptable – 30 000 FG/mois</option>
<option value="patron">Patron – 60 000 FG/mois</option>
</select>
<button class="main" data-a="mkuser">Créer le compte</button>
<p id="res" class="m"></p>
</div>

<h3>Boutiques et abonnements</h3>
<div id="list">Chargement...</div>
</div>

<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,
 signOut,createUserWithEmailAndPassword,deleteUser
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
 getFirestore,collection,doc,setDoc,updateDoc,deleteDoc,
 getDocs,writeBatch,onSnapshot,Timestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const cfg={
 apiKey:"AIzaSyDFS_aJPHmarHVL8UiHwn39njO34Kk7k1w",
 authDomain:"ma-boutique-e1fe3.firebaseapp.com",
 projectId:"ma-boutique-e1fe3",
 storageBucket:"ma-boutique-e1fe3.firebasestorage.app",
 messagingSenderId:"66591651573",
 appId:"1:66591651573:web:572780596e446d3c6c37bc"
};

const ADMIN="PQ15rICcjFSALPRUsWQxaVxuXFH3";

const app=initializeApp(cfg);
const auth=getAuth(app);
const db=getFirestore(app);
const secApp=initializeApp(cfg,"sec");
const secAuth=getAuth(secApp);

const $=s=>document.querySelector(s);
const v=id=>$("#"+id).value.trim();

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
}[c]));

const fd=ms=>ms?new Date(ms).toLocaleDateString("fr-FR"):"Non définie";

let shops=[];
let unsub=null;
let busy=false;

function toast(t){
 const e=$("#toast");
 e.textContent=t;
 e.style.display="block";
 clearTimeout(toast.t);
 toast.t=setTimeout(()=>e.style.display="none",4000);
}

function show(x){
 $("#login").style.display=x==="login"?"block":"none";
 $("#app").style.display=x==="app"?"block":"none";
}

$("#lf").onsubmit=async e=>{
 e.preventDefault();
 $("#err").textContent="";
 try{
  await signInWithEmailAndPassword(auth,v("em"),$("#pw").value);
 }catch(x){
  $("#err").textContent="E-mail ou mot de passe incorrect.";
 }
};

onAuthStateChanged(auth,u=>{
 if(unsub){unsub();unsub=null;}

 if(u&&u.uid===ADMIN){
  show("app");
  unsub=onSnapshot(collection(db,"shops"),s=>{
   shops=s.docs.map(d=>({id:d.id,...d.data()}));
   draw();
  },e=>toast("Erreur de lecture : "+e.code));
 }else{
  if(u){
   $("#err").textContent="Accès réservé à l'administrateur.";
   signOut(auth);
  }
  show("login");
 }
});

async function draw(){
 const s=$("#sel");
 const cur=s.value;

 s.innerHTML=shops.map(x=>
  `<option value="${esc(x.id)}">${esc(x.name||x.id)} (${esc(x.id)})</option>`
 ).join("");

 if(cur)s.value=cur;

 const list=$("#list");
 list.innerHTML="Chargement des boutiques...";

 const cards=await Promise.all(shops.map(async x=>{
  let patron=0,vendeurs=0,comptables=0;

  try{
   const m=await getDocs(collection(db,"shops",x.id,"members"));
   m.forEach(d=>{
    const role=d.data().role;
    if(role==="patron")patron++;
    if(role==="vendeur")vendeurs++;
    if(role==="comptable")comptables++;
   });
  }catch(e){
   return `<div class="card"><b>${esc(x.name||x.id)}</b><p class="neg">Impossible de lire les membres.</p></div>`;
  }

  const total=(patron?60000:0)+30000*(vendeurs+comptables);
  const ms=x.accessUntil?.toMillis?.()||0;
  const act=ms>Date.now();
  const st=x.blocked?"Bloquée":act?(x.trial?"Essai gratuit":"Active"):(x.trial?"Essai terminé":"Expirée");

  return `
  <div class="card">
   <b>${esc(x.name||x.id)}</b><br>
   <small>Code : ${esc(x.id)}</small><br>
   <b>${st}</b> · Fin : ${fd(ms)}
   ${x.ownerEmail?`<br><small>Patron : ${esc(x.ownerEmail)}</small>`:""}
   <hr>
   <b>Comptes enregistrés</b><br>
   Patron : ${patron}<br>
   Vendeurs : ${vendeurs}<br>
   Comptables : ${comptables}
   <p class="price">${total.toLocaleString("fr-FR")} FG / mois</p>
   <small>Calcul : ${patron? "60 000 FG patron":"Aucun patron"} + ${(vendeurs+comptables).toLocaleString("fr-FR")} × 30 000 FG</small>
   <div class="bt">
    <button data-a="ext" data-id="${esc(x.id)}" data-n="30">+30 jours</button>
    <button data-a="ext" data-id="${esc(x.id)}" data-n="90">+90 jours</button>
    <button class="${x.blocked?"":"x"}" data-a="blk" data-id="${esc(x.id)}">${x.blocked?"Débloquer":"Bloquer"}</button>
    <button class="x" data-a="del" data-id="${esc(x.id)}">Supprimer</button>
   </div>
  </div>`;
 }));

 list.innerHTML=cards.join("")||'<p class="m">Aucune boutique.</p>';
}

const A={

 out:async()=>{
  await signOut(auth);
 },

 mkshop:async()=>{
  if(busy)return;
  const c=v("sc").toLowerCase();
  const n=v("sn");
  const type=$("#st").value;
  const d=Number(v("sd"))||30;

  if(!/^[a-z0-9-]{3,30}$/.test(c))
   return toast("Code : 3 à 30 lettres, chiffres ou tirets.");

  if(!n)return toast("Le nom est obligatoire.");
  if(d<1||d>3650)return toast("Nombre de jours invalide.");
  if(shops.some(x=>x.id===c))return toast("Ce code existe déjà.");

  busy=true;
  try{
   await setDoc(doc(db,"shops",c),{
    name:n,
    type,
    plan:"complet",
    blocked:false,
    trial:false,
    accessUntil:Timestamp.fromMillis(Date.now()+d*86400000)
   });

   toast("Boutique créée avec succès.");
   ["sc","sn","sd"].forEach(i=>$("#"+i).value="");
  }catch(e){
   toast("Création refusée : "+(e.code||e.message));
  }finally{
   busy=false;
  }
 },

 ext:async b=>{
  const x=shops.find(s=>s.id===b.dataset.id);
  if(!x)return;

  const days=Number(b.dataset.n);
  const base=Math.max(Date.now(),x.accessUntil?.toMillis?.()||0);

  try{
   await updateDoc(doc(db,"shops",x.id),{
    accessUntil:Timestamp.fromMillis(base+days*86400000),
    trial:false
   });
   toast("Abonnement prolongé de "+days+" jours.");
  }catch(e){
   toast("Erreur : "+(e.code||e.message));
  }
 },

 blk:async b=>{
  const x=shops.find(s=>s.id===b.dataset.id);
  if(!x)return;

  if(!confirm((x.blocked?"Débloquer ":"Bloquer ")+x.name+" ?"))return;

  try{
   await updateDoc(doc(db,"shops",x.id),{blocked:!x.blocked});
   toast(x.blocked?"Boutique débloquée.":"Boutique bloquée.");
  }catch(e){
   toast("Erreur : "+(e.code||e.message));
  }
 },

 del:async b=>{
  const x=shops.find(s=>s.id===b.dataset.id);
  if(!x)return;

  const t=prompt(
   "Suppression définitive de "+(x.name||x.id)+
   ". Tous les produits, ventes, dépenses, dettes et profils seront supprimés.\n\n"+
   "Tape le code de la boutique : "+x.id
  );

  if(t===null)return;
  if(t.trim().toLowerCase()!==x.id)return toast("Code incorrect.");

  try{
   toast("Suppression en cours...");

   for(const sub of ["sales","expenses","products","debts","members"]){
    const snap=await getDocs(collection(db,"shops",x.id,sub));

    for(let i=0;i<snap.docs.length;i+=400){
     const batch=writeBatch(db);
     const part=snap.docs.slice(i,i+400);

     part.forEach(d=>{
      batch.delete(d.ref);

      if(sub==="members"){
       batch.delete(doc(db,"users",d.id));
      }
     });

     await batch.commit();
    }
   }

   await deleteDoc(doc(db,"shops",x.id));
   toast("Boutique supprimée.");
  }catch(e){
   toast("Erreur de suppression : "+(e.code||e.message));
  }
 },

 mkuser:async()=>{
  if(busy)return;

  const code=$("#sel").value;
  const em=v("ue").toLowerCase();
  const pw=$("#up").value;
  const role=$("#ur").value;
  const shop=shops.find(s=>s.id===code);

  if(!shop)return toast("Sélectionne une boutique.");
  if(!em||pw.length<8)return toast("E-mail et mot de passe (8 caractères minimum).");

  if(role==="patron"&&shop.ownerUid)
   return toast("Cette boutique possède déjà un patron.");

  busy=true;
  let createdUser=null;

  try{
   const result=await createUserWithEmailAndPassword(secAuth,em,pw);
   createdUser=result.user;

   const uid=createdUser.uid;
   const batch=writeBatch(db);

   batch.set(doc(db,"shops",code,"members",uid),{
    role,
    email:em
   });

   batch.set(doc(db,"users",uid),{
    shop:code
   });

   if(role==="patron"){
    batch.update(doc(db,"shops",code),{
     ownerUid:uid,
     ownerEmail:em,
     plan:"complet"
    });
   }

   await batch.commit();

   await signOut(secAuth);
   createdUser=null;

   $("#res").textContent=
    "Compte créé. Boutique : "+code+
    ". Adresse : "+em+
    ". Communique le mot de passe au titulaire de manière confidentielle.";

   $("#ue").value="";
   $("#up").value="";
   toast("Compte "+role+" créé avec succès.");
   draw();

  }catch(e){
   if(createdUser){
    try{
     await deleteUser(createdUser);
    }catch(cleanError){
     console.error("Nettoyage du compte incomplet",cleanError);
    }
   }

   try{await signOut(secAuth);}catch(ignore){}

   toast("Création refusée : "+(e.code||e.message));
  }finally{
   busy=false;
  }
 }

};

document.addEventListener("click",e=>{
 const b=e.target.closest("button[data-a]");
 if(b&&A[b.dataset.a])A[b.dataset.a](b);
});

show("login");
</script>
</body>
</html>
