<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ma Boutique</title>
<style>
:root{--bg:#f5f7f4;--c:#fff;--t:#1c2a23;--m:#66766d;--p:#1f7a4d;--r:#c0392b;--b:#dde4df}
@media(prefers-color-scheme:dark){:root{--bg:#111613;--c:#1a221d;--t:#edf3ee;--m:#98a89e;--p:#3fb27a;--r:#ff7b6b;--b:#2a352e}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
#login,#app{display:none;max-width:560px;margin:auto;padding:14px}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
button{font:inherit;padding:10px 14px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)}
button.main{background:var(--p);color:#fff;border:0;width:100%;margin-top:6px}
button.x{color:var(--r)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px 12px;margin:7px 0}
.bt{display:flex;gap:6px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin:8px 0}
small,.m{color:var(--m)}
.w{background:#fff3cd;color:#664d03;padding:10px;border-radius:10px;margin:8px 0}
#bar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#nav button{flex:1;border:0;background:none;padding:10px 2px;font-size:14px}
#nav .on{color:var(--p);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
.big{font-size:22px;font-weight:700}.neg{color:var(--r)}
</style></head>
<body>
<div id="login">
<h2>Ma Boutique</h2>
<form id="lf">
<input id="code" placeholder="Code de la boutique" autocapitalize="none" required>
<input id="em" type="email" placeholder="E-mail" autocomplete="username" required>
<input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
<button class="main">Se connecter</button>
<p id="err" class="neg"></p>
</form>
</div>
<div id="app"><div id="bar"></div><div id="ban"></div><div id="main"></div></div>
<div id="nav"></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,getDoc,collection,addDoc,updateDoc,deleteDoc,onSnapshot,query,where,writeBatch,increment,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDFS_aJPHmarHVL8UiHwn39njO34Kk7k1w",authDomain:"ma-boutique-e1fe3.firebaseapp.com",projectId:"ma-boutique-e1fe3",storageBucket:"ma-boutique-e1fe3.firebasestorage.app",messagingSenderId:"66591651573",appId:"1:66591651573:web:572780596e446d3c6c37bc"});
const auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
const $=s=>document.querySelector(s),F=n=>Number(n||0).toLocaleString('fr-FR')+' GNF',
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
today=()=>new Date().toLocaleDateString('sv'),sum=(a,k)=>a.reduce((t,x)=>t+(+x[k]||0),0),
c=n=>collection(db,'shops',S.shop,n),
store={get:k=>{try{return localStorage.getItem(k)}catch(e){}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}},
S={tab:'',month:today().slice(0,7),products:[],sales:[],exp:[],debts:[],u:[]};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
const go=p=>p.catch(e=>toast('Refusé : '+(e.code||e.message))),
ok=()=>S.rw||(toast('Abonnement terminé : lecture seule'),false);
function show(v){$('#login').style.display=v=='login'?'block':'none';$('#app').style.display=v=='app'?'block':'none';$('#nav').style.display=v=='app'?'flex':'none'}
$('#code').value=store.get('code')||'';
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';store.set('code',$('#code').value.trim());
 try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(x){$('#err').textContent='E-mail ou mot de passe incorrect'}};
onAuthStateChanged(auth,u=>u?start(u):(S.role=null,show('login')));
async function start(u){const code=store.get('code');
 try{const m=await getDoc(doc(db,'shops',code,'members',u.uid));if(!m.exists())throw 0;
  const sh=await getDoc(doc(db,'shops',code));S.shop=code;S.role=m.data().role;S.info=sh.data();
  S.rw=!S.info.blocked&&S.info.accessUntil?.toMillis()>Date.now();
  S.tab=S.role=='comptable'?'bilan':'vendre';listen();show('app')
 }catch(x){$('#err').textContent='Code de boutique ou compte incorrect';signOut(auth)}}
function listen(){S.u.forEach(f=>f());S.u=[];const r=S.role,mq=n=>query(c(n),where('month','==',S.month)),
 L=(q,k)=>S.u.push(onSnapshot(q,s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>toast('Lecture refusée')));
 L(mq('sales'),'sales');
 if(r!='comptable'){L(c('products'),'products');L(c('debts'),'debts')}
 if(r!='vendeur')L(mq('expenses'),'exp');draw()}
const TABS={patron:[['vendre','Vendre'],['produits','Produits'],['depenses','Dépenses'],['dettes','Dettes'],['bilan','Bilan']],vendeur:[['vendre','Vendre'],['produits','Stock'],['dettes','Dettes']],comptable:[['bilan','Bilan']]};
function draw(){if(!S.role)return;if(document.activeElement?.matches('#main input,#main select'))return;
 const ms=S.info.accessUntil?.toMillis()||0,exp=new Date(ms).toLocaleDateString('fr-FR'),left=Math.ceil((ms-Date.now())/864e5);
 $('#bar').innerHTML=`<b>${esc(S.info.name||'Ma Boutique')}</b><small>${S.role}</small><button data-a="out">Sortir</button>`;
 $('#ban').innerHTML=S.rw?(left<=7?`<div class="w">Votre abonnement se termine le ${exp}. Pensez à le renouveler.</div>`:''):`<div class="w">Abonnement terminé (${exp}). Lecture seule : contactez votre fournisseur pour réactiver.</div>`;
 $('#nav').innerHTML=TABS[S.role].map(([k,l])=>`<button class="${k==S.tab?'on':''}" data-a="tab" data-k="${k}">${l}</button>`).join('');
 $('#main').innerHTML=V[S.tab]()}
const pr=p=>`<div><b>${esc(p.name)}</b><br><small>${F(p.price)} · stock ${p.stock}</small></div>`,
V={
vendre:()=>{const ts=S.sales.filter(s=>s.day==today());
 return `<h3>Aujourd’hui : ${F(sum(ts,'total'))}</h3>`+(S.products.map(p=>`<div class="row">${pr(p)}<div class="bt"><button data-a="sell" data-id="${p.id}" data-n="1">+1</button><button data-a="sell" data-id="${p.id}" data-n="5">+5</button><button data-a="sell" data-id="${p.id}" data-n="0">…</button></div></div>`).join('')||'<p class="m">Aucun produit. Le patron doit en ajouter.</p>')
 +'<h4>Ventes du jour</h4>'+ts.sort((a,b)=>(b.ts?.seconds||9e9)-(a.ts?.seconds||9e9)).map(s=>`<div class="row"><span>${s.qty} × ${esc(s.name)}</span><span>${F(s.total)}${S.role=='patron'?` <button class="x" data-a="delsale" data-id="${s.id}">✕</button>`:''}</span></div>`).join('')},
produits:()=>(S.role=='patron'?`<div class="card"><input id="pn" placeholder="Nom du produit"><input id="pp" type="number" inputmode="numeric" placeholder="Prix de vente (GNF)"><input id="ps" type="number" inputmode="numeric" placeholder="Stock de départ"><button class="main" data-a="addp">Ajouter</button></div>`:'')
 +S.products.map(p=>`<div class="row">${pr(p)}${S.role=='patron'?`<div class="bt"><button data-a="stk" data-id="${p.id}">Stock</button><button data-a="prx" data-id="${p.id}">Prix</button><button class="x" data-a="delp" data-id="${p.id}">✕</button></div>`:''}</div>`).join(''),
depenses:()=>`<div class="card"><input id="el" placeholder="Libellé (ex : salaire de Fanta)"><input id="ea" type="number" inputmode="numeric" placeholder="Montant (GNF)"><select id="ec">${['Salaire','Loyer','Électricité','Transport','Achat de marchandise','Autre'].map(x=>`<option>${x}</option>`).join('')}</select><button class="main" data-a="adde">Enregistrer</button></div><h4>Total du mois : ${F(sum(S.exp,'amount'))}</h4>`
 +S.exp.sort((a,b)=>b.day>a.day?1:-1).map(e=>`<div class="row"><div><b>${esc(e.label)}</b><br><small>${esc(e.cat)} · ${e.day}</small></div><div>${F(e.amount)} <button class="x" data-a="dele" data-id="${e.id}">✕</button></div></div>`).join(''),
dettes:()=>`<div class="card"><input id="dn" placeholder="Nom du client"><input id="da" type="number" inputmode="numeric" placeholder="Montant dû (GNF)"><button class="main" data-a="addd">Ajouter la dette</button></div><h4>Total à recevoir : ${F(S.debts.reduce((t,d)=>t+d.amount-d.paid,0))}</h4>`
 +S.debts.map(d=>{const r=d.amount-d.paid;return `<div class="row"><div><b>${esc(d.name)}</b><br><small>${r>0?'Reste '+F(r):'Soldée'}</small></div><div class="bt">${r>0?`<button data-a="payd" data-id="${d.id}">Payé</button>`:''}<button class="x" data-a="deld" data-id="${d.id}">✕</button></div></div>`}).join(''),
bilan:()=>{const sv=sum(S.sales,'total'),dp=sum(S.exp,'amount'),r=sv-dp,days={},cats={};
 S.sales.forEach(s=>days[s.day]=(days[s.day]||0)+s.total);S.exp.forEach(e=>cats[e.cat]=(cats[e.cat]||0)+e.amount);
 return `<input type="month" id="mo" data-a="mon" value="${S.month}"><div class="card">Ventes<div class="big">${F(sv)}</div>Dépenses (salaires inclus)<div class="big">${F(dp)}</div>Résultat<div class="big ${r<0?'neg':''}">${F(r)}</div></div><h4>Dépenses par catégorie</h4>`
 +(Object.entries(cats).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${F(v)}</b></div>`).join('')||'<p class="m">Aucune dépense.</p>')
 +'<h4>Ventes par jour</h4>'+(Object.keys(days).sort().reverse().map(k=>`<div class="row"><span>${k.split('-').reverse().join('/')}</span><b>${F(days[k])}</b></div>`).join('')||'<p class="m">Aucune vente.</p>')}};
const v=id=>$('#'+id).value.trim(),P=id=>S.products.find(x=>x.id==id),D=()=>({day:today(),month:today().slice(0,7),by:auth.currentUser.uid}),
A={out:()=>signOut(auth),
tab:b=>{S.tab=b.dataset.k;if(S.tab=='vendre'&&S.month!=today().slice(0,7)){S.month=today().slice(0,7);listen()}draw()},
sell:b=>{if(!ok())return;const p=P(b.dataset.id),n=+b.dataset.n||+prompt('Quantité vendue ?');if(!(n>0))return;if(n>p.stock)return toast('Stock insuffisant');
 const w=writeBatch(db);w.set(doc(c('sales')),{pid:p.id,name:p.name,qty:n,total:n*p.price,ts:serverTimestamp(),...D()});w.update(doc(c('products'),p.id),{stock:increment(-n)});go(w.commit());toast('Vendu : '+n+' × '+p.name)},
delsale:b=>{if(!ok()||!confirm('Annuler cette vente ?'))return;const s=S.sales.find(x=>x.id==b.dataset.id),w=writeBatch(db);w.delete(doc(c('sales'),s.id));w.update(doc(c('products'),s.pid),{stock:increment(s.qty)});go(w.commit())},
addp:()=>{if(!ok())return;const n=v('pn'),p=+v('pp'),s=+v('ps');if(!n||!(p>=0))return toast('Nom et prix obligatoires');go(addDoc(c('products'),{name:n,price:p,stock:s||0}))},
stk:b=>{if(!ok())return;const n=+prompt('Quantité à ajouter (ex : 20) ou à retirer (ex : -5)');if(n)go(updateDoc(doc(c('products'),b.dataset.id),{stock:increment(n)}))},
prx:b=>{if(!ok())return;const n=+prompt('Nouveau prix (GNF)');if(n>=0)go(updateDoc(doc(c('products'),b.dataset.id),{price:n}))},
delp:b=>{if(ok()&&confirm('Supprimer ce produit ?'))go(deleteDoc(doc(c('products'),b.dataset.id)))},
adde:()=>{if(!ok())return;const l=v('el'),a=+v('ea');if(!l||!(a>0))return toast('Libellé et montant obligatoires');go(addDoc(c('expenses'),{label:l,amount:a,cat:v('ec'),...D()}))},
dele:b=>{if(ok()&&confirm('Supprimer cette dépense ?'))go(deleteDoc(doc(c('expenses'),b.dataset.id)))},
addd:()=>{if(!ok())return;const n=v('dn'),a=+v('da');if(!n||!(a>0))return toast('Nom et montant obligatoires');go(addDoc(c('debts'),{name:n,amount:a,paid:0,day:today()}))},
payd:b=>{if(!ok())return;const n=+prompt('Montant payé (GNF)');if(n>0)go(updateDoc(doc(c('debts'),b.dataset.id),{paid:increment(n)}))},
deld:b=>{if(ok()&&confirm('Supprimer cette dette ?'))go(deleteDoc(doc(c('debts'),b.dataset.id)))}};
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)});
document.addEventListener('change',e=>{if(e.target.id=='mo'&&e.target.value){S.month=e.target.value;listen()}});
show('login');
</script></body></html>
